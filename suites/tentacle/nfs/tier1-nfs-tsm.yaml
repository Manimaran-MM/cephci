#===============================================================================================
#---    Test Suite for NFS-Ganesha TSM (Transparent State Migration)   ---
#===============================================================================================
# Conf: conf/tentacle/nfs/1admin-12node-4client.yaml (>=4 NFS + >=3 clients)
#   or baremetal with >=4 NFS roles / equivalent
#
# Purpose:
#   Automate NFS-Ganesha Transparent State Migration (TSM) validation.
#   TSM syncs NFSv4 client state (opens/locks/delegations) across Ganesha peers
#   via enable_TSM / Tsm_Port so HA/failover can reclaim state.
#
# Requirements:
#   - >=3 NFS nodes in conf for TC-01..09 (count=3, placement hosts)
#   - >=4 NFS nodes when TC-10 is selected (4-host pool, count=3)
#   - Grace IO conflict (test_nfs_tsm_grace_io.py): >=4 NFS + >=3 clients
#     (spare NFS + spare client open-hold + iptables -I for ~90s grace)
#   - TC-08/10 reboot the mount server where clients are connected
#   - Product build that renders enable_TSM / Tsm_Port in ganesha.conf
#
# Layout:
#   1. Bootstrap + clients
#   2. Basic TSM enablement (conf + listen + IO)
#   3. Peer sync (Ceph_Nodes, ESTAB, recovery log markers)
#   4. Record validation (steady-state open/lock counters)
#   5. Grace IO open-conflict during extended grace — test_nfs_tsm_grace_io.py
#   6. TSM + delegation lifecycle (open/lock/deleg peer summary — test_nfs_tsm_delegation.py)
#
# Negative scenarios live in tier1-nfs-tsm-negative.yaml
#
#===============================================================================================
