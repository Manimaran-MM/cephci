  - test:
      name: Server-Side Copy (XCOPY) Core Operations & Scenarios
      module: xcopy.test_nfs_xcopy_intra_export_sync.py
      desc: Verify core xcopy operations and scenarios.
      abort-on-fail: false
      config:
        test_cases:
          - intra_export_copy_offload_on
          # - cross_export_copy_offload_on
          - large_file_async_copy_offload_on
        nfs_version: "4.2"
        clients: 1
        # 128 MiB / 64 MiB chunk => 2 chunks (enough for math); keeps run fast.
        # XCOPY-03 uses large_file_size_mb (default 2048) instead.
        file_size_mb: 128
        chunk_size_mb: 64
        large_file_size_mb: 2048
      comments: |
        XCOPY-02 (cross_export_copy_offload_on) - IBMCEPH-21037
